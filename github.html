<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="github.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header>
      <div class="header-eyebrow">// TOOL v1.0.0</div>
      <h1 class="header-title">GitHub<span>_</span>Finder</h1>
      <p class="header-desc">&gt; Search any GitHub user to inspect their profile, stats &amp; repositories.</p>
    </header>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-prefix">@</span>
        <input
          id="search-input"
          type="text"
          placeholder="username"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </div>
      <button id="search-btn">Run →</button>
    </div>

    <!-- Status -->
    <div class="status-line">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-msg">Awaiting target username...</span>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="loader-line"></div>
      <div class="loader-text">Fetching data from GitHub API...</div>
      <div class="loader-line" style="animation-delay:0.3s;opacity:0.5"></div>
    </div>

    <!-- Error -->
    <div class="error-box" id="error-box">
      <div class="error-code" id="error-code">// ERROR</div>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Result -->
    <div id="result">

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="profile-top">
          <div class="avatar-wrap">
            <img id="avatar" class="avatar" src="" alt="" width="96" height="96" />
            <div class="avatar-badge">✓</div>
          </div>
          <div class="profile-info">
            <div class="profile-name" id="name"></div>
            <div class="profile-login">
              <a id="profile-link" href="#" target="_blank" rel="noopener"
                 style="color:inherit;text-decoration:none;"><span id="login"></span></a>
            </div>
            <div class="profile-bio" id="bio"></div>
            <div class="profile-meta">
              <span class="meta-item">
                <span class="meta-icon">📍</span>
                <span id="meta-location"></span>
              </span>
              <span class="meta-item">
                <span class="meta-icon">🏢</span>
                <span id="meta-company"></span>
              </span>
              <span class="meta-item">
                <span class="meta-icon">🔗</span>
                <a id="meta-blog" href="#" target="_blank" rel="noopener"
                   style="color:var(--blue);text-decoration:none;"></a>
              </span>
              <span class="meta-item">
                <span class="meta-icon">📅</span>
                <span id="meta-joined"></span>
              </span>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-box" style="animation-delay:0.05s">
            <span class="stat-value" id="stat-repos">0</span>
            <span class="stat-label">Repos</span>
          </div>
          <div class="stat-box" style="animation-delay:0.1s">
            <span class="stat-value" id="stat-followers">0</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat-box" style="animation-delay:0.15s">
            <span class="stat-value" id="stat-following">0</span>
            <span class="stat-label">Following</span>
          </div>
          <div class="stat-box" style="animation-delay:0.2s">
            <span class="stat-value" id="stat-gists">0</span>
            <span class="stat-label">Gists</span>
          </div>
        </div>

        <!-- Repos -->
        <div class="section-label">Top Repositories</div>
        <div class="repos-grid" id="repos-grid"></div>
      </div>

    </div><!-- /#result -->

  </div><!-- /.app -->

  <script src="github.js"></script>
</body>
</html>
